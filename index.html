<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roadtrip!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; overflow: hidden;}
        #map { width: 100%; height: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .gmnoprint { transition: opacity 0.3s ease; }
        .place-card.active { border-color: #3b82f6; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5); background-color: #eff6ff;}
        
        /* Förhindrar att touch-gester zoomar in webbsidan när man ritar */
        .touch-none-map { touch-action: none; }
    </style>
</head>
<!-- h-[100dvh] är avgörande för mobiler så att UI:t anpassar sig när adressfält försvinner/dyker upp -->
<body class="h-[100dvh] flex flex-col">

    <!-- Header är nu mer kompakt på mobiler och tillåter element att radbrytas (flex-wrap) -->
    <header class="bg-white shadow-md z-20 flex flex-col md:flex-row items-center justify-between p-3 md:px-6 md:py-3 border-b border-gray-200 gap-3 md:gap-4 overflow-y-auto max-h-[40vh] md:max-h-none">
        <div class="flex items-center gap-2 md:gap-3 w-full md:w-auto justify-center md:justify-start">
            <div class="bg-indigo-600 p-1.5 md:p-2 rounded-lg text-white">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
            </div>
            <h1 class="text-base md:text-lg font-bold text-gray-800 whitespace-nowrap">Draw & Search</h1>
        </div>

        <div class="flex flex-wrap items-center gap-2 md:gap-3 w-full justify-center md:justify-end">
            
            <div class="flex gap-2 items-center bg-gray-50 p-1 md:p-1.5 rounded-lg border border-gray-200 flex-1 min-w-[150px] md:min-w-[200px] max-w-xs">
                <input type="password" id="apiKey" placeholder="Google API-nyckel" class="w-full px-2 py-1 md:py-1.5 text-xs md:text-sm border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button onclick="initApp()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] md:text-xs px-2 md:px-3 py-1.5 rounded font-medium transition-colors whitespace-nowrap">Starta</button>
            </div>

            <button id="loginBtn" onclick="handleAuthClick()" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 flex items-center gap-1.5 text-[10px] md:text-xs px-2 md:px-3 py-1.5 rounded font-medium transition-colors whitespace-nowrap shadow-sm">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Logga in
            </button>

            <select id="placeType" class="text-xs md:text-sm border-gray-300 rounded-lg py-1.5 pl-2 pr-6 md:pl-3 md:pr-8 focus:ring-indigo-500 border bg-white cursor-pointer font-medium text-gray-700 flex-1 min-w-[120px]">
                <option value="hotel">🏨 Hotell</option>
                <option value="tourist attraction">📸 Sevärdheter</option>
                <option value="restaurant">🍽️ Restauranger</option>
            </select>

            <div class="relative flex-1 min-w-[120px]">
                <input type="text" id="freeText" placeholder="Fritext..." class="w-full pl-7 pr-2 py-1.5 text-xs md:text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <svg class="w-3.5 h-3.5 text-gray-400 absolute left-2 top-2 md:top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>

            <div class="flex items-center gap-2 pl-2 border-l border-gray-300">
                <div class="flex flex-col">
                    <label class="text-[9px] md:text-[10px] font-bold text-gray-500 uppercase tracking-wide">Min Betyg: <span id="ratingVal" class="text-indigo-600">4.0</span></label>
                    <input type="range" id="minRating" min="1" max="5" step="0.5" value="4.0" class="w-16 md:w-20 accent-indigo-600" oninput="document.getElementById('ratingVal').innerText = this.value">
                </div>
            </div>
        </div>
    </header>

    <!-- flex-col för mobil (karta uppe, lista nere), md:flex-row för desktop (sida vid sida) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        <div class="flex-1 relative bg-gray-200 min-h-[40vh]">
            <div id="map"></div>
            
            <div id="mapOverlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-10 p-4">
                <svg class="w-12 h-12 md:w-20 md:h-20 text-indigo-200 mb-2 md:mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-1 md:mb-2 text-center">Väntar på API-nyckel</h2>
                <p class="text-gray-500 max-w-md text-center text-xs md:text-sm">Klistra in nyckeln och klicka på Starta. <br> Kräver "Places API (New)".</p>
            </div>

            <!-- Floating draw button adjusted for touch -->
            <div id="drawBtn" class="absolute top-3 md:top-4 left-1/2 transform -translate-x-1/2 z-10 hidden">
                <button onclick="activateDrawMode()" class="bg-white hover:bg-indigo-50 border-2 border-indigo-500 text-indigo-700 font-semibold text-xs md:text-sm px-4 py-2 md:px-5 md:py-2 rounded-full shadow-lg flex items-center gap-2 transition-all active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    Rita sökområde
                </button>
            </div>

            <div id="drawingToast" class="absolute top-3 md:top-4 left-1/2 transform -translate-x-1/2 z-10 hidden w-[90%] max-w-sm">
                <div class="bg-indigo-600 text-white font-semibold text-xs md:text-sm px-4 py-2 rounded-full shadow-lg flex items-center justify-center gap-2 animate-pulse">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    Dra med fingret/musen på kartan...
                </div>
            </div>

            <!-- NY KNAPP: Min position (Flyttad uppåt för att inte skymma Googles zoom-knappar) -->
            <button onclick="findMyLocation()" class="absolute bottom-32 md:bottom-28 right-4 z-10 bg-white p-2.5 md:p-3 rounded-full shadow-lg hover:bg-gray-50 text-gray-700 border border-gray-200 transition-all active:scale-95" title="Visa min position">
                <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 22v-4m0-14V2m10 10h-4M6 12H2m18 0a8 8 0 11-16 0 8 8 0 0116 0z"></path>
                </svg>
            </button>
        </div>

        <!-- På mobil är denna list-del 40% av höjden och ligger i botten. På desktop är den en sidokolumn. -->
        <aside class="w-full md:w-96 h-[45%] md:h-full bg-white border-t md:border-t-0 md:border-l border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] md:shadow-2xl flex flex-col z-20">
            <div class="p-3 md:p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-gray-800 flex items-center gap-2 text-sm md:text-base">
                    <svg class="w-4 h-4 md:w-5 md:h-5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 01-1.32.95l-3.7-1.48-3.7 1.48A1 1 0 014 16V4z" clip-rule="evenodd"></path></svg>
                    Hittade Platser
                </h3>
                <span id="resultCount" class="bg-indigo-100 text-indigo-800 text-[10px] md:text-xs font-bold px-2 py-1 rounded-full">0 st</span>
            </div>
            
            <div id="statusMessage" class="hidden m-2 md:m-4 p-2 md:p-3 rounded text-xs md:text-sm font-medium text-center shrink-0"></div>

            <div class="flex-1 overflow-y-auto p-2 md:p-4 custom-scrollbar space-y-3 md:space-y-4" id="placeList">
                <div class="h-full flex flex-col items-center justify-center text-gray-400 space-y-2 md:space-y-3">
                    <svg class="w-8 h-8 md:w-12 md:h-12 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <p class="text-xs md:text-sm italic text-center px-4">Rita ett område på kartan för att starta sökningen.</p>
                </div>
            </div>
        </aside>
    </main>

    <script>
        let map;
        let currentPolygon = null;
        let placeMarkers = [];
        let infoWindow;
        let activePlaceId = null;

        let isDrawMode = false;
        let isMouseDown = false;
        let freehandPath = [];
        let freehandLine = null;
        let mdListener, mmListener;
        
        let userLocationMarker = null; // Håller koll på den blå "du är här"-pricken

        let tokenClient;
        let accessToken = null;
        let driveFileId = null;
        
        const CLIENT_ID = '940508107225-2h91m1o4he6r27g1q7hgtaq0f6127dd8.apps.googleusercontent.com'; 

        window.onload = function () {
            const savedKey = localStorage.getItem('googleMapsApiKey');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }

            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/drive.appdata',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        document.getElementById('loginBtn').innerHTML = '✅ Inloggad';
                        document.getElementById('loginBtn').classList.add('bg-green-50', 'text-green-700', 'border-green-200');
                        loadKeyFromDrive();
                    }
                },
            });
        };

        function handleAuthClick() {
            tokenClient.requestAccessToken({prompt: 'consent'});
        }

        async function loadKeyFromDrive() {
            try {
                setStatus('Letar efter sparad nyckel på din Drive...', 'info');
                const res = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name="hotellAppKey.txt"', {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                const data = await res.json();
                
                if (data.files && data.files.length > 0) {
                    driveFileId = data.files[0].id;
                    const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
                        headers: { Authorization: `Bearer ${accessToken}` }
                    });
                    const key = await fileRes.text();
                    
                    document.getElementById('apiKey').value = key.trim();
                    setStatus('Nyckel hämtad från Google Drive!', 'info');
                    initApp();
                } else {
                    setStatus('Ingen nyckel sparad på Drive ännu. Skriv in den och tryck Starta.', 'info');
                }
            } catch (err) {
                console.error(err);
                setStatus('Kunde inte läsa från Drive.', 'error');
            }
        }

        async function saveKeyToDrive(keyStr) {
            if (!accessToken) return;
            
            try {
                const metadata = { name: 'hotellAppKey.txt', parents: ['appDataFolder'] };
                const file = new Blob([keyStr], {type: 'text/plain'});
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
                form.append('file', file);

                let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
                let method = 'POST';

                if (driveFileId) {
                    url = `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`;
                    method = 'PATCH';
                }

                const res = await fetch(url, {
                    method: method,
                    headers: { Authorization: `Bearer ${accessToken}` },
                    body: form
                });
                const data = await res.json();
                if(data.id) driveFileId = data.id; 
            } catch (err) {
                console.error("Fel vid sparande till Drive:", err);
            }
        }

        function setStatus(msg, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            if(!msg) {
                statusDiv.classList.add('hidden');
                return;
            }
            statusDiv.className = 'm-2 md:m-4 p-2 md:p-3 rounded text-xs md:text-sm font-medium text-center border break-words shrink-0';
            if (type === 'error') statusDiv.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
            else if (type === 'info') statusDiv.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
            else if (type === 'warning') statusDiv.classList.add('bg-yellow-50', 'text-yellow-700', 'border-yellow-200');
            
            statusDiv.innerText = msg;
            statusDiv.classList.remove('hidden');
        }

        function initApp() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) return;

            localStorage.setItem('googleMapsApiKey', apiKey);
            saveKeyToDrive(apiKey);

            document.getElementById('mapOverlay').innerHTML = '<p class="text-indigo-600 font-bold animate-pulse text-sm">Laddar modern karta...</p>';

            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&v=3.64&libraries=geometry&callback=initializeMap&loading=async`;
            script.async = true;
            script.defer = true;
            script.onerror = () => {
                document.getElementById('mapOverlay').innerHTML = '<p class="text-red-500 font-bold text-sm">Kunde inte ladda Google Maps.</p>';
            };
            document.head.appendChild(script);
        }

        window.initializeMap = function() {
            document.getElementById('mapOverlay').style.display = 'none';
            document.getElementById('drawBtn').style.display = 'flex';

            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 59.3293, lng: 18.0686 }, 
                zoom: 12,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false, // Tar bort fullscreenknappen som stökar till det på mobil
                styles: [
                    { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] }
                ]
            });

            infoWindow = new google.maps.InfoWindow();
        };

        function activateDrawMode() {
            if (isDrawMode) return;
            isDrawMode = true;

            document.getElementById('drawBtn').style.display = 'none';
            document.getElementById('drawingToast').style.display = 'flex';
            
            // Stänger av touch-panning så att fingret ritar istället
            map.setOptions({ draggable: false, gestureHandling: 'none', draggableCursor: 'crosshair' });

            freehandPath = [];
            if (freehandLine) { freehandLine.setMap(null); freehandLine = null; }
            if (currentPolygon) { currentPolygon.setMap(null); currentPolygon = null; }

            // Google Maps omvandlar touch-drag till mousedown/mousemove när gestureHandling är 'none'
            mdListener = map.addListener('mousedown', function(e) {
                isMouseDown = true;
                freehandPath = [e.latLng];

                mmListener = map.addListener('mousemove', function(e) {
                    if (!isMouseDown) return;
                    freehandPath.push(e.latLng);
                    if (freehandLine) {
                        freehandLine.setPath(freehandPath);
                    } else {
                        freehandLine = new google.maps.Polyline({
                            path: freehandPath,
                            strokeColor: '#4f46e5',
                            strokeWeight: 2.5,
                            strokeOpacity: 0.8,
                            map: map
                        });
                    }
                });

                // Avsluta ritningen (Stödjer både mus och touch)
                function onInteractEnd() {
                    document.removeEventListener('mouseup', onInteractEnd);
                    document.removeEventListener('touchend', onInteractEnd); // Touch support
                    document.removeEventListener('touchcancel', onInteractEnd);
                    
                    isMouseDown = false;
                    isDrawMode = false;
                    
                    google.maps.event.removeListener(mdListener);
                    google.maps.event.removeListener(mmListener);
                    
                    // Slå på touch-scroll i kartan igen
                    map.setOptions({ draggable: true, gestureHandling: 'auto', draggableCursor: '' });
                    if (freehandLine) { freehandLine.setMap(null); freehandLine = null; }

                    document.getElementById('drawingToast').style.display = 'none';
                    document.getElementById('drawBtn').style.display = 'flex';

                    if (freehandPath.length < 3) return;

                    currentPolygon = new google.maps.Polygon({
                        paths: freehandPath,
                        fillColor: '#4f46e5',
                        fillOpacity: 0.15,
                        strokeWeight: 2,
                        strokeColor: '#4f46e5',
                        map: map
                    });

                    performSearchInPolygon(currentPolygon);
                }
                
                // Lyssna på dokumentet för att fånga när man lyfter fingret/musen
                document.addEventListener('mouseup', onInteractEnd);
                document.addEventListener('touchend', onInteractEnd);
                document.addEventListener('touchcancel', onInteractEnd);
            });
        };

        function findMyLocation() {
            if (navigator.geolocation) {
                setStatus('Letar efter din GPS-position...', 'info');
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const pos = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                        };

                        // Panorera kartan till användaren och zooma in
                        map.panTo(pos);
                        map.setZoom(14);
                        setStatus(null); // Rensa meddelandet

                        // Om vi redan har en blå prick, flytta den. Annars skapa en ny.
                        if (userLocationMarker) {
                            userLocationMarker.setPosition(pos);
                        } else {
                            userLocationMarker = new google.maps.Marker({
                                position: pos,
                                map: map,
                                icon: {
                                    path: google.maps.SymbolPath.CIRCLE,
                                    scale: 8,
                                    fillColor: '#3b82f6',
                                    fillOpacity: 1,
                                    strokeColor: 'white',
                                    strokeWeight: 2,
                                },
                                title: "Din position",
                                zIndex: 9999 // Ser till att den ligger över eventuella hotell
                            });
                        }
                    },
                    (error) => {
                        console.error("Geolokaliseringsfel: ", error);
                        setStatus('Kunde inte hämta din position. Har du gett webbläsaren/telefonen tillåtelse att dela plats?', 'error');
                    },
                    // Sätt timeout och hög noggrannhet för GPS på mobiler
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 } 
                );
            } else {
                setStatus('Din webbläsare verkar inte ha stöd för geolokalisering.', 'error');
            }
        }

        async function performSearchInPolygon(polygon) {
            clearResults();
            setStatus('Beräknar sökarea...', 'info');

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) return;

            const polygonPath = polygon.getPath();
            let north = -90, south = 90, east = -180, west = 180;
            
            for (let i = 0; i < polygonPath.getLength(); i++) {
                const pt = polygonPath.getAt(i);
                if (pt.lat() > north) north = pt.lat();
                if (pt.lat() < south) south = pt.lat();
                if (pt.lng() > east) east = pt.lng();
                if (pt.lng() < west) west = pt.lng();
            }
            
            setStatus('Söker via Places API (New)...', 'info');

            const minRating = parseFloat(document.getElementById('minRating').value);
            const placeType = document.getElementById('placeType').value;
            const freeText = document.getElementById('freeText').value.trim();
            
            const queryStr = freeText ? `${freeText} ${placeType}` : placeType;

            try {
                const response = await fetch('https://places.googleapis.com/v1/places:searchText', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Goog-Api-Key': apiKey,
                        'X-Goog-FieldMask': 'places.id,places.displayName,places.location,places.rating,places.priceLevel,places.formattedAddress,places.photos,places.primaryType,places.googleMapsUri'
                    },
                    body: JSON.stringify({
                        textQuery: queryStr,
                        locationRestriction: {
                            rectangle: { low: { latitude: south, longitude: west }, high: { latitude: north, longitude: east } }
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'API-fel');
                }

                const data = await response.json();

                if (data.places && data.places.length > 0) {
                    filterAndDisplayResults(data.places, polygon, minRating, apiKey);
                } else {
                    setStatus(`Hittade inga platser som matchade "${queryStr}" i området.`, 'warning');
                }

            } catch (error) {
                console.error(error);
                setStatus(`Ett fel uppstod: ${error.message}`, 'error');
            }
        }

        function filterAndDisplayResults(allResults, polygon, minRating, apiKey) {
            let filtered = allResults.filter(place => {
                if(!place.location) return false;
                const latLng = new google.maps.LatLng(place.location.latitude, place.location.longitude);
                return google.maps.geometry.poly.containsLocation(latLng, polygon);
            });

            filtered = filtered.filter(place => {
                const rating = place.rating || 0;
                return rating >= minRating;
            });

            if (filtered.length === 0) {
                setStatus('Hittade platser, men inga klarade kravet på minsta betyg inuti formen.', 'warning');
                return;
            }

            setStatus(null);
            document.getElementById('resultCount').innerText = `${filtered.length} st`;
            
            const listContainer = document.getElementById('placeList');
            listContainer.innerHTML = '';

            filtered.forEach((place, index) => {
                const placeId = place.id;
                const location = { lat: place.location.latitude, lng: place.location.longitude };
                
                const marker = new google.maps.Marker({
                    map: map,
                    position: location,
                    title: place.displayName.text,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10, // Lite mindre ikoner på mobil
                        fillColor: "#ef4444",
                        fillOpacity: 1,
                        strokeColor: "white",
                        strokeWeight: 2,
                    },
                    label: { text: (index + 1).toString(), color: "white", fontSize: "10px", fontWeight: "bold" }
                });

                placeMarkers.push({ id: placeId, marker: marker, data: place });

                let photoUrl = 'https://placehold.co/300x200/f8fafc/94a3b8?text=Ingen+Bild';
                if (place.photos && place.photos.length > 0) {
                    const photoName = place.photos[0].name;
                    photoUrl = `https://places.googleapis.com/v1/${photoName}/media?key=${apiKey}&maxHeightPx=200&maxWidthPx=300`;
                }

                let typeStr = (place.primaryType || '').replace(/_/g, ' ');
                typeStr = typeStr.charAt(0).toUpperCase() + typeStr.slice(1);

                let priceBadge = '';
                if(place.priceLevel) {
                    let pStr = '';
                    if (place.priceLevel === 'PRICE_LEVEL_INEXPENSIVE') pStr = '💰 Billigt';
                    if (place.priceLevel === 'PRICE_LEVEL_MODERATE') pStr = '💰💰 Mellan';
                    if (place.priceLevel === 'PRICE_LEVEL_EXPENSIVE') pStr = '💰💰💰 Dyrt';
                    if (place.priceLevel === 'PRICE_LEVEL_VERY_EXPENSIVE') pStr = '💰💰💰💰 Lyx';
                    if(pStr) priceBadge = `<span class="text-[9px] md:text-[10px] font-medium text-gray-600 bg-gray-100 px-1.5 md:px-2 py-0.5 md:py-1 rounded border border-gray-200">${pStr}</span>`;
                }

                const card = document.createElement('div');
                card.id = `card-${placeId}`;
                card.className = 'place-card bg-white border border-gray-200 rounded-lg md:rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all cursor-pointer flex md:flex-col relative group';
                
                const mapLinkHtml = place.googleMapsUri ? 
                    `<a href="${place.googleMapsUri}" target="_blank" onclick="event.stopPropagation()" class="text-indigo-600 hover:bg-indigo-50 p-1 md:p-1.5 rounded-full transition-colors ml-auto" title="Öppna i Google Maps">
                        <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>` : '';

                // Layouten på kortet anpassas. På mobil visas bild och text sida-vid-sida för att spara plats
                card.innerHTML = `
                    <div class="absolute top-1 left-1 md:top-2 md:left-2 bg-red-500 text-white w-5 h-5 md:w-6 md:h-6 rounded-full flex items-center justify-center text-[10px] md:text-xs font-bold z-10 shadow-md border border-white">${index + 1}</div>
                    <div class="w-24 h-auto md:w-full md:h-32 bg-gray-200 overflow-hidden relative shrink-0">
                        <img src="${photoUrl}" alt="${place.displayName.text}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                        <div class="hidden md:flex absolute top-2 right-2 bg-white/95 px-2 py-1 rounded-md text-xs font-bold text-gray-800 items-center gap-1 shadow-sm">
                            <span class="text-amber-400 text-sm">★</span> ${place.rating || 'N/A'}
                        </div>
                    </div>
                    <div class="p-2 md:p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start gap-1">
                                <h4 class="font-bold text-gray-800 text-xs md:text-sm leading-tight mb-0.5 md:mb-1 line-clamp-2">${place.displayName.text}</h4>
                                <div class="md:hidden flex shrink-0 bg-gray-50 px-1 rounded text-[10px] font-bold text-gray-700 items-center gap-0.5 border border-gray-100">
                                    <span class="text-amber-400">★</span> ${place.rating || '-'}
                                </div>
                            </div>
                            <p class="text-[9px] md:text-[11px] text-gray-400 font-medium mb-1 uppercase tracking-wider line-clamp-1">${typeStr}</p>
                            <p class="text-[10px] md:text-xs text-gray-500 truncate" title="${place.formattedAddress}">${place.formattedAddress}</p>
                        </div>
                        <div class="mt-2 md:mt-3 flex justify-between items-center">
                            ${priceBadge}
                            ${mapLinkHtml}
                        </div>
                    </div>
                `;

                listContainer.appendChild(card);

                card.onclick = () => {
                    highlightPlace(placeId);
                    map.panTo(location);
                    if(map.getZoom() < 14) map.setZoom(14);
                };

                marker.addListener('click', () => {
                    highlightPlace(placeId);
                    const listElement = document.getElementById('placeList');
                    const cardElement = document.getElementById(`card-${placeId}`);
                    if(cardElement) {
                        listElement.scrollTo({
                            top: cardElement.offsetTop - listElement.offsetTop - 8,
                            behavior: 'smooth'
                        });
                    }
                });
            });
        }

        function highlightPlace(id) {
            placeMarkers.forEach(hm => {
                hm.marker.setIcon({ ...hm.marker.getIcon(), fillColor: "#ef4444", scale: 10 });
                hm.marker.setZIndex(1);
                const el = document.getElementById(`card-${hm.id}`);
                if(el) el.classList.remove('active');
            });

            activePlaceId = id;
            const activeData = placeMarkers.find(hm => hm.id === id);
            
            if (activeData) {
                activeData.marker.setIcon({ ...activeData.marker.getIcon(), fillColor: "#3b82f6", scale: 14 });
                activeData.marker.setZIndex(999);
                
                infoWindow.setContent(`<div class="p-1 font-sans text-xs md:text-sm font-bold">${activeData.data.displayName.text}</div>`);
                infoWindow.open(map, activeData.marker);

                const activeCard = document.getElementById(`card-${id}`);
                if(activeCard) activeCard.classList.add('active');
            }
        }

        function clearResults() {
            placeMarkers.forEach(hm => hm.marker.setMap(null));
            placeMarkers = [];
            infoWindow.close();
            activePlaceId = null;
            document.getElementById('resultCount').innerText = `0 st`;
            document.getElementById('placeList').innerHTML = '';
        }
        
        function triggerSearchIfPolygonExists() {
            if (currentPolygon) {
                performSearchInPolygon(currentPolygon);
            }
        }

        document.getElementById('placeType').addEventListener('change', triggerSearchIfPolygonExists);
        document.getElementById('minRating').addEventListener('change', triggerSearchIfPolygonExists);

        let typingTimer;
        document.getElementById('freeText').addEventListener('input', function() {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(triggerSearchIfPolygonExists, 800); 
        });

    </script>
</body>
</html>
